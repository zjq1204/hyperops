# Run from the HyperOps repository root. Application processes use
# WatchedFileHandler and reopen renamed files on their next log write.
__HYPEROPS_ROOT__/data/logs/api/application.log __HYPEROPS_ROOT__/data.dev/logs/api/application.log __HYPEROPS_ROOT__/data/logs/worker/worker.log __HYPEROPS_ROOT__/data.dev/logs/worker/worker.log __HYPEROPS_ROOT__/data/logs/scheduler/beat.log __HYPEROPS_ROOT__/data.dev/logs/scheduler/beat.log {
    daily
    maxsize 50M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0640 root root
}

__HYPEROPS_ROOT__/data/logs/nginx/access.log __HYPEROPS_ROOT__/data.dev/logs/nginx/access.log {
    daily
    maxsize 50M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0640 root root
    sharedscripts
    postrotate
        docker kill -s USR1 nginx nginx-dev >/dev/null 2>&1 || true
    endscript
}

__HYPEROPS_ROOT__/data/logs/api/gunicorn_error.log __HYPEROPS_ROOT__/data.dev/logs/api/gunicorn_error.log {
    daily
    maxsize 50M
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0640 root root
    sharedscripts
    postrotate
        docker kill -s USR1 backend-api >/dev/null 2>&1 || true
    endscript
}

__HYPEROPS_ROOT__/data/logs/nginx/error.log __HYPEROPS_ROOT__/data.dev/logs/nginx/error.log {
    daily
    maxsize 50M
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0640 root root
    sharedscripts
    postrotate
        docker kill -s USR1 nginx nginx-dev >/dev/null 2>&1 || true
    endscript
}
